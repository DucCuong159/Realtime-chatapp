# GitHub Labeler configuration
# Automatically labels PRs based on the paths of modified files

frontend:
  - changed-files:
      - any-glob-to-any-file: "frontend/**"

backend:
  - changed-files:
      - any-glob-to-any-file: "backend/**"

ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".coderabbit.yaml"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "**/*.md"
          - "docs/**"
