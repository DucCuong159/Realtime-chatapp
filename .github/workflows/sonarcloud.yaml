# ═══════════════════════════════════════════════════════════════════════════════
# SonarCloud Analysis Workflow
# ═══════════════════════════════════════════════════════════════════════════════
# Runs SonarCloud code analysis on push to main and on all pull requests.
# Includes a custom PR bot that counts issues and blocks merge if total > 10.
#
# Prerequisites:
#   - SONAR_TOKEN must be set in GitHub repo Settings → Secrets → Actions
#     (Generate at: SonarCloud → My Account → Security → Generate Token)
# ═══════════════════════════════════════════════════════════════════════════════

name: SonarCloud Analysis
run-name: "SonarCloud - ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
      - stg
      - prd
    types: [opened, synchronize, reopened]

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ─── Job 1: SonarCloud Scan ──────────────────────────────────────────────────
jobs:
  sonarcloud-scan:
    name: 🔍 SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Full clone is REQUIRED for accurate SonarCloud "New Code" analysis
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install Yarn Classic
        run: npm install -g yarn@1.22.22 --ignore-scripts

      # ─── Install & Build Backend ─────────────────────────────────────────
      - name: Cache Backend dependencies
        uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
          key: backend-yarn-${{ runner.os }}-${{ hashFiles('backend/yarn.lock') }}
          restore-keys: |
            backend-yarn-${{ runner.os }}-

      - name: Install Backend dependencies
        working-directory: ./backend
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build Backend
        working-directory: ./backend
        run: yarn build

      # ─── Install & Build Frontend ────────────────────────────────────────
      - name: Cache Frontend dependencies
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
          key: frontend-yarn-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            frontend-yarn-${{ runner.os }}-

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build Frontend
        working-directory: ./frontend
        run: yarn build
        env:
          CI: false

      # ─── SonarCloud Analysis ─────────────────────────────────────────────
      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Wait for SonarCloud server to process results and check Quality Gate
      - name: SonarCloud Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─── Job 2: Custom PR Bot (Issue Counter & Gate) ─────────────────────────
  sonar-pr-bot:
    name: 🤖 PR Quality Bot
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: sonarcloud-scan
    timeout-minutes: 5

    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fetch SonarCloud Issues & Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          PROJECT_KEY="DucCuong159_Realtime-chatapp"
          MAX_ISSUES=10

          echo "══════════════════════════════════════════════════"
          echo "🤖 SonarCloud PR Bot - Fetching issues for PR #${PR_NUMBER}"
          echo "══════════════════════════════════════════════════"

          # ─── 1. Fetch issues from SonarCloud API ───────────────────────────
          # Try PR-specific issues first, fallback to overall project issues
          RESPONSE=$(curl -sf -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=${PROJECT_KEY}&pullRequest=${PR_NUMBER}&resolved=false&ps=500" \
            2>/dev/null || \
            curl -sf -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=${PROJECT_KEY}&resolved=false&ps=500")

          # ─── 2. Parse issue counts by type and severity ────────────────────
          TOTAL_ISSUES=$(echo "$RESPONSE" | jq '.total // 0')
          BUGS=$(echo "$RESPONSE" | jq '[.issues[] | select(.type=="BUG")] | length')
          VULNERABILITIES=$(echo "$RESPONSE" | jq '[.issues[] | select(.type=="VULNERABILITY")] | length')
          CODE_SMELLS=$(echo "$RESPONSE" | jq '[.issues[] | select(.type=="CODE_SMELL")] | length')
          BLOCKER=$(echo "$RESPONSE" | jq '[.issues[] | select(.severity=="BLOCKER")] | length')
          CRITICAL=$(echo "$RESPONSE" | jq '[.issues[] | select(.severity=="CRITICAL")] | length')
          MAJOR=$(echo "$RESPONSE" | jq '[.issues[] | select(.severity=="MAJOR")] | length')

          echo "📊 Results: Total=${TOTAL_ISSUES} | Bugs=${BUGS} | Vulns=${VULNERABILITIES} | Smells=${CODE_SMELLS}"
          echo "📊 Severity: Blocker=${BLOCKER} | Critical=${CRITICAL} | Major=${MAJOR}"

          # ─── 3. Determine pass/fail status ─────────────────────────────────
          if [ "$TOTAL_ISSUES" -gt "$MAX_ISSUES" ]; then
            STATUS_ICON="❌"
            STATUS_MSG="**FAILED** — Tổng số issue (\`${TOTAL_ISSUES}\`) vượt quá ngưỡng cho phép (\`${MAX_ISSUES}\`). Cần fix trước khi merge!"
          else
            STATUS_ICON="✅"
            STATUS_MSG="**PASSED** — Số lượng issue nằm trong ngưỡng cho phép (\`${TOTAL_ISSUES}\` / \`${MAX_ISSUES}\`)"
          fi

          # ─── 4. Build and post PR comment ──────────────────────────────────
          COMMENT_BODY="${STATUS_ICON} **SonarCloud Quality Report** — PR #${PR_NUMBER}

          ${STATUS_MSG}

          ### 📊 Issue Summary

          | Loại | Số lượng |
          | :--- | :---: |
          | 🐛 Bugs | \`${BUGS}\` |
          | 🔓 Vulnerabilities | \`${VULNERABILITIES}\` |
          | 🧹 Code Smells | \`${CODE_SMELLS}\` |
          | **🎯 Tổng cộng** | **\`${TOTAL_ISSUES}\` / \`${MAX_ISSUES}\`** |

          ### 🔥 Severity Breakdown

          | Mức độ | Số lượng |
          | :--- | :---: |
          | 🚫 Blocker | \`${BLOCKER}\` |
          | 🔴 Critical | \`${CRITICAL}\` |
          | 🟠 Major | \`${MAJOR}\` |

          ---
          🔍 [Xem chi tiết trên SonarCloud](https://sonarcloud.io/project/issues?id=${PROJECT_KEY}&pullRequest=${PR_NUMBER})
          📋 [Dashboard tổng quan](https://sonarcloud.io/summary/overall?id=${PROJECT_KEY})"

          gh pr comment "${PR_NUMBER}" --body "${COMMENT_BODY}"
          echo "✅ Comment đã được gửi lên PR #${PR_NUMBER}"

          # ─── 5. Enforce quality gate ───────────────────────────────────────
          if [ "$TOTAL_ISSUES" -gt "$MAX_ISSUES" ]; then
            echo ""
            echo "══════════════════════════════════════════════════"
            echo "❌ QUALITY GATE FAILED"
            echo "   Total issues: ${TOTAL_ISSUES} (max allowed: ${MAX_ISSUES})"
            echo "   Please fix at least $((TOTAL_ISSUES - MAX_ISSUES)) issue(s) before merging."
            echo "══════════════════════════════════════════════════"
            exit 1
          fi

          echo ""
          echo "══════════════════════════════════════════════════"
          echo "✅ QUALITY GATE PASSED"
          echo "══════════════════════════════════════════════════"
