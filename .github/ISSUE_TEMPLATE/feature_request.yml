name: "✨ Feature Request"
description: "Suggest a new idea, feature, or enhancement for the application"
title: "feat: [Short summary of the feature]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a great idea or improvement? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Need"
      description: "Is your feature request related to a problem or missing capability?"
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution / Feature Description"
      description: "A clear and concise description of what you want to happen."
      placeholder: "Describe the desired solution and user flow..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "A description of any alternative solutions or features you've considered."
      placeholder: "Other libraries, designs, or approaches..."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "Additional Context / Mockups"
      description: "Add any other context, UI screenshots, or mockups about the feature request here."
    validations:
      required: false
