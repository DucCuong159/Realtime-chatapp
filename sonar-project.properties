# ─── Project Identification ──────────────────────────────────────────────────
sonar.projectKey=DucCuong159_Realtime-chatapp
sonar.organization=duccuong159

# ─── Source Code Configuration (Monorepo) ────────────────────────────────────
# Scan both backend and frontend source directories
sonar.sources=backend/src,frontend/src

# ─── Source Encoding ─────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ─── Exclusions ──────────────────────────────────────────────────────────────
# Exclude files/directories that should NOT be analyzed
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/script/**

# ─── Test Configuration ─────────────────────────────────────────────────────
# Define test file patterns (separated from production code analysis)
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/__tests__/**

# ─── Coverage Reports (LCOV) & Exclusions ──────────────────────────────────
# Point to LCOV coverage reports generated by test runners (Jest/Vitest/Node test)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Narrowly scoped exclusions for non-business logic, UI layouts, pages, routes, type definitions, and configs
sonar.coverage.exclusions=\
  frontend/src/components/**,\
  frontend/src/layouts/**,\
  frontend/src/pages/**,\
  frontend/src/routes/**,\
  frontend/src/types/**,\
  frontend/src/config/**,\
  backend/src/config/**,\
  backend/src/script/**,\
  backend/src/@types/**,\
  backend/src/routes/**,\
  **/*.config.ts,\
  **/*.config.js

# ─── Duplication Exclusions ──────────────────────────────────────────────────
# Exclude auto-generated or config files from duplication detection
sonar.cpd.exclusions=\
  **/config/**,\
  **/*.config.ts,\
  **/*.config.js
