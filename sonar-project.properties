# ─── Project Identification ──────────────────────────────────────────────────
sonar.projectKey=DucCuong159_Realtime-chatapp
sonar.organization=duccuong159

# ─── Source Code Configuration (Monorepo) ────────────────────────────────────
# Scan both backend and frontend source directories
sonar.sources=backend/src,frontend/src

# ─── Source Encoding ─────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ─── Exclusions ──────────────────────────────────────────────────────────────
# Exclude files/directories that should NOT be analyzed
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/script/**

# ─── Test Configuration ─────────────────────────────────────────────────────
# Define test file patterns (separated from production code analysis)
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/__tests__/**

# ─── Coverage Reports (LCOV) ────────────────────────────────────────────────
# Point to LCOV coverage reports generated by test runners (Jest/Vitest)
# Uncomment and adjust paths when coverage is configured:
# sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# ─── Duplication Exclusions ──────────────────────────────────────────────────
# Exclude auto-generated or config files from duplication detection
sonar.cpd.exclusions=\
  **/config/**,\
  **/*.config.ts,\
  **/*.config.js
